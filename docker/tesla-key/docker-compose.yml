# Variáveis em .env (copiar de .env.example) ou, numa stack do Portainer, em "Environment variables"
services:
  tesla-key:
    build:
      context: .
      args:
        SSH_USER: ${SSH_USER:-admin}
        SSH_UID: ${SSH_UID:-1001}
    image: tesla-key:latest
    pull_policy: build            # reconstrói sempre a imagem no deploy (ex.: "Pull and redeploy" no Portainer)
    container_name: ${CONTAINER_NAME:-tesla-key}
    hostname: tesla-key
    restart: unless-stopped
    environment:
      SSH_PUBKEY: ${SSH_PUBKEY:-}             # chaves extra do utilizador principal (separadas por ";")
      SSH_EXTRA_USER: ${SSH_EXTRA_USER:-}     # utilizador SSH extra (opcional), ex. para outro portal
      SSH_EXTRA_PUBKEY: ${SSH_EXTRA_PUBKEY:-} # chave(s) pública(s) do utilizador extra
      SSH_EXTRA_SUDO: ${SSH_EXTRA_SUDO:-1}    # 1 = sudo sem password; 0 = sem sudo
      SSH_EXTRA_UID: ${SSH_EXTRA_UID:-}       # UID do utilizador extra (opcional)
    ports:
      - "${HTTP_PORT:-8088}:80"   # HTTP -> Proxy Reverso do DSM (só /.well-known)
      - "${SSH_PORT:-2223}:22"    # SSH (só rede local, não abrir no router)
      - "${ADMIN_PORT:-8089}:8001" # portal admin (só rede local, não abrir no router)
    expose:
      - "8000"                    # gateway API: só na rede Docker, sem publish
    volumes:
      # DATA_DIR: pasta dos dados no NAS. "." = pasta do projeto (docker compose no NAS);
      # numa stack do Portainer a partir do Git tem de ser um caminho absoluto (ex.: /volume1/docker/tesla-key)
      - ${DATA_DIR:-.}/ssh/authorized_keys:/import/authorized_keys:ro
      - ${DATA_DIR:-.}/html:/var/www/html
      - ${DATA_DIR:-.}/hostkeys:/etc/ssh/keys
      - ${DATA_DIR:-.}/tesla:/opt/tesla   # tesla.env, keys/, tokens.json, gateway.db, imagens/

networks:
  default:
    name: ${DOCKER_NETWORK:-tesla-net}   # rede partilhada com o portal (já existente)
    external: true
