server {
    listen 80 default_server;
    server_name tesla.cubiculo.giize.com;
    root /var/www/html;

    # Só serve a chave pública da Tesla
    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        default_type application/x-pem-file;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
