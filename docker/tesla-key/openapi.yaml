openapi: 3.0.3
info:
  title: tesla-key gateway — API de clientes
  version: "1.0"
  description: |
    Gateway interno para a Tesla Fleet API. Cada cliente usa a sua chave no header X-API-Key
    (criada com `tesla-setup cliente add <nome>`). Ver API.md.
servers:
  - url: http://tesla-key:8000
    description: Mesma rede Docker
security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    vin:
      name: vin
      in: path
      required: true
      schema: { type: string }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string }
    Veiculo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        vin: { type: string }
        display_name: { type: string }
        state: { type: string, enum: [online, asleep, offline] }
        in_service: { type: boolean }
        access_type: { type: string }
    TokenStatus:
      type: object
      properties:
        ok: { type: boolean }
        obtido_em: { type: string, format: date-time, nullable: true }
        expira_em: { type: string, format: date-time, nullable: true }
        segundos_restantes: { type: integer, nullable: true }
        tem_refresh_token: { type: boolean }
    ChargeState:
      type: object
      description: Distâncias em milhas
      properties:
        battery_level: { type: integer, description: "%" }
        battery_range: { type: number, description: milhas }
        charge_limit_soc: { type: integer }
        charging_state: { type: string, enum: [Disconnected, Stopped, Charging, Complete, NoPower, Starting] }
        charger_power: { type: number, description: kW }
        time_to_full_charge: { type: number, description: horas }
      additionalProperties: true
    VehicleData:
      type: object
      properties:
        response:
          type: object
          properties:
            vin: { type: string }
            display_name: { type: string }
            state: { type: string }
            charge_state: { $ref: "#/components/schemas/ChargeState" }
            climate_state:
              type: object
              properties:
                inside_temp: { type: number, description: "°C" }
                outside_temp: { type: number, description: "°C" }
                is_climate_on: { type: boolean }
              additionalProperties: true
            drive_state:
              type: object
              properties:
                shift_state: { type: string, nullable: true }
                speed: { type: number, nullable: true, description: mph }
                power: { type: number }
                latitude: { type: number, description: "só com location_data" }
                longitude: { type: number, description: "só com location_data" }
              additionalProperties: true
            vehicle_state:
              type: object
              properties:
                odometer: { type: number, description: milhas }
                locked: { type: boolean }
                sentry_mode: { type: boolean }
                car_version: { type: string }
              additionalProperties: true
          additionalProperties: true
        cache: { type: boolean, description: "true se veio da cache do gateway" }
        seccoes_negadas: { type: array, items: { type: string }, description: "secções pedidas sem permissão" }
        idade_s: { type: integer, description: "idade da cache (s), só quando cache=true" }
  responses:
    NaoAutorizado:
      description: X-API-Key em falta, errada ou cliente desativado
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Adormecido:
      description: Veículo a dormir ou offline
      content:
        application/json:
          schema:
            type: object
            properties:
              erro: { type: string }
              estado: { type: string, example: asleep }
    SemPermissao:
      description: O cliente não tem a permissão necessária, ou a funcionalidade está desativada no gateway (ver GET /api/me)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    FalhaTesla:
      description: Falha na Tesla ou na renovação do token
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    SemTokens:
      description: Gateway sem tokens (falta `tesla-setup token`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }

paths:
  /api/health:
    get:
      summary: Gateway a responder
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }

  /api/me:
    get:
      summary: Nome e permissões do cliente (sempre permitido)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente: { type: string }
                  permissoes:
                    type: array
                    items:
                      type: string
                      enum: [veiculos, carga, clima, conducao, estado, config, localizacao, imagem, token, acordar, fleet]
                  desativadas_no_gateway: { type: array, items: { type: string } }
                  descricao: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }

  /api/token/status:
    get:
      summary: Estado do token Tesla (valida também a chave do cliente)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/TokenStatus" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles:
    get:
      summary: Lista de veículos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: array, items: { $ref: "#/components/schemas/Veiculo" } }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "502": { $ref: "#/components/responses/FalhaTesla" }
        "503": { $ref: "#/components/responses/SemTokens" }

  /api/vehicles/{vin}:
    get:
      summary: Estado do veículo (não acorda o carro)
      parameters: [{ $ref: "#/components/parameters/vin" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { response: { $ref: "#/components/schemas/Veiculo" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/data:
    get:
      summary: Dados do veículo (vehicle_data) com cache
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: endpoints
          in: query
          schema:
            type: string
            default: charge_state;climate_state;drive_state;vehicle_state;vehicle_config
          description: Secções separadas por `;` (também location_data, gui_settings)
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
          description: "1 ignora a cache"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleData" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "408": { $ref: "#/components/responses/Adormecido" }
        "429": { description: Limite de pedidos da Tesla }
        "502": { $ref: "#/components/responses/FalhaTesla" }
        "503": { $ref: "#/components/responses/SemTokens" }

  /api/vehicles/{vin}/location:
    get:
      summary: Localização simplificada (requer o scope vehicle_location)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  vin: { type: string }
                  latitude: { type: number }
                  longitude: { type: number }
                  direcao: { type: integer, nullable: true, description: graus }
                  velocidade_kmh: { type: integer, nullable: true }
                  mudanca: { type: string, nullable: true, description: "P, R, N, D" }
                  gps_em: { type: string, format: date-time, nullable: true }
                  mapa: { type: string, description: URL OpenStreetMap }
                  cache: { type: boolean }
                  idade_s: { type: integer }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403":
          description: Sem a permissão localizacao, ou sem coordenadas (falta o scope vehicle_location)
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "408": { $ref: "#/components/responses/Adormecido" }

  /api/vehicles/{vin}/image:
    get:
      summary: Imagem do modelo (render do configurador Tesla, não das câmaras)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: view
          in: query
          schema: { type: string, default: STUD_3QTR, enum: [STUD_3QTR, STUD_SIDE, STUD_REAR, STUD_FRONT, STUD_SEAT] }
        - name: size
          in: query
          schema: { type: integer, default: 800, minimum: 200, maximum: 2048 }
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
        - name: formato
          in: query
          schema: { type: string, enum: [url] }
          description: "url devolve só o URL do compositor em JSON"
      responses:
        "200":
          description: Imagem (ou JSON com formato=url)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  origem: { type: string, enum: [config, auto] }
                  view: { type: string }
                  size: { type: integer }
        "400":
          description: view inválida
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "408": { $ref: "#/components/responses/Adormecido" }
        "502": { $ref: "#/components/responses/FalhaTesla" }

  /api/vehicles/{vin}/wake:
    post:
      summary: Acorda o carro (custo extra, gasta bateria)
      parameters: [{ $ref: "#/components/parameters/vin" }]
      responses:
        "200": { description: "Pedido aceite; consultar /api/vehicles/{vin} até state=online" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/fleet/{caminho}:
    get:
      summary: Passthrough só de leitura para /api/1/{caminho} da Fleet API
      parameters:
        - name: caminho
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Resposta da Tesla sem alterações }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
