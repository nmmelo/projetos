openapi: 3.0.3
info:
  title: tesla-key gateway — API de clientes
  version: "1.0"
  description: |
    Gateway interno para a Tesla Fleet API. Cada cliente usa a sua chave no header X-API-Key
    (criada com `tesla-setup cliente add <nome>`). Ver API.md.
servers:
  - url: http://tesla-key:8000
    description: Mesma rede Docker
security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ano: { name: ano, in: query, schema: { type: integer }, description: "ex.: 2026" }
    mes: { name: mes, in: query, schema: { type: string }, description: "ex.: 2026-11" }
    semana: { name: semana, in: query, schema: { type: string }, description: "semana ISO, ex.: 2026-W46" }
    dias: { name: dias, in: query, schema: { type: integer }, description: "últimos N dias" }
    de: { name: de, in: query, schema: { type: string, format: date } }
    ate: { name: ate, in: query, schema: { type: string, format: date }, description: exclusivo }
    vin:
      name: vin
      in: path
      required: true
      schema: { type: string }
  schemas:
    Viagem:
      type: object
      properties:
        id: { type: integer }
        vin: { type: string }
        estado: { type: string, enum: [aberta, fechada] }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time, nullable: true }
        lat_inicio: { type: number }
        lon_inicio: { type: number }
        lat_fim: { type: number, nullable: true }
        lon_fim: { type: number, nullable: true }
        odo_inicio_km: { type: number }
        odo_fim_km: { type: number, nullable: true }
        km: { type: number, nullable: true }
        bateria_inicio: { type: integer }
        bateria_fim: { type: integer, nullable: true }
        velocidade_max_kmh: { type: integer, nullable: true }
        pontos: { type: integer }
        origem: { type: string, enum: [leituras, inferida, tessie] }
        tessie_id: { type: integer, nullable: true }
        local_inicio: { type: string, nullable: true }
        local_fim: { type: string, nullable: true }
        energia_kwh: { type: number, nullable: true }
        velocidade_media_kmh: { type: number, nullable: true }
        temp_exterior: { type: number, nullable: true }
        temp_interior: { type: number, nullable: true }
        autopilot_km: { type: number, nullable: true }
    Carregamento:
      type: object
      properties:
        id: { type: integer }
        vin: { type: string }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time, nullable: true }
        estado: { type: string, enum: [a_carregar, terminado] }
        origem: { type: string, enum: [leituras, inferido, supercharger, tessie] }
        tessie_id: { type: integer, nullable: true }
        tipo: { type: string, enum: [AC, DC], nullable: true }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        local: { type: string, nullable: true }
        bateria_inicio: { type: integer, nullable: true }
        bateria_fim: { type: integer, nullable: true }
        energia_kwh: { type: number, nullable: true }
        potencia_max_kw: { type: number, nullable: true }
        custo: { type: number, nullable: true }
        moeda: { type: string, nullable: true }
        sessao_tesla: { type: string, nullable: true }
        odo_km: { type: number, nullable: true }
        pontos: { type: integer }
    Erro:
      type: object
      description: "O motivo fica nos logs do gateway (Definições → Logs → API), pesquisável pela ref."
      properties:
        codigo: { type: integer, example: 403 }
        erro: { type: string, example: Forbidden }
        ref: { type: integer, description: "id do registo no gateway", example: 1234 }
        detalhe: { type: string, description: "só se o administrador ativar respostas detalhadas" }
    Veiculo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vehicle_id: { type: integer, format: int64 }
        vin: { type: string }
        display_name: { type: string }
        state: { type: string, enum: [online, asleep, offline] }
        in_service: { type: boolean }
        access_type: { type: string }
    TokenStatus:
      type: object
      properties:
        ok: { type: boolean }
        obtido_em: { type: string, format: date-time, nullable: true }
        expira_em: { type: string, format: date-time, nullable: true }
        segundos_restantes: { type: integer, nullable: true }
        tem_refresh_token: { type: boolean }
    ChargeState:
      type: object
      description: Distâncias em milhas
      properties:
        battery_level: { type: integer, description: "%" }
        battery_range: { type: number, description: milhas }
        charge_limit_soc: { type: integer }
        charging_state: { type: string, enum: [Disconnected, Stopped, Charging, Complete, NoPower, Starting] }
        charger_power: { type: number, description: kW }
        time_to_full_charge: { type: number, description: horas }
      additionalProperties: true
    VehicleData:
      type: object
      properties:
        response:
          type: object
          properties:
            vin: { type: string }
            display_name: { type: string }
            state: { type: string }
            charge_state: { $ref: "#/components/schemas/ChargeState" }
            climate_state:
              type: object
              properties:
                inside_temp: { type: number, description: "°C" }
                outside_temp: { type: number, description: "°C" }
                is_climate_on: { type: boolean }
              additionalProperties: true
            drive_state:
              type: object
              properties:
                shift_state: { type: string, nullable: true }
                speed: { type: number, nullable: true, description: mph }
                power: { type: number }
                latitude: { type: number, description: "só com location_data" }
                longitude: { type: number, description: "só com location_data" }
              additionalProperties: true
            vehicle_state:
              type: object
              properties:
                odometer: { type: number, description: milhas }
                locked: { type: boolean }
                sentry_mode: { type: boolean }
                car_version: { type: string }
              additionalProperties: true
          additionalProperties: true
        cache: { type: boolean, description: "true se veio da cache do gateway" }
        seccoes_negadas: { type: array, items: { type: string }, description: "secções pedidas sem permissão" }
        idade_s: { type: integer, description: "idade da cache (s), só quando cache=true" }
  responses:
    NaoAutorizado:
      description: X-API-Key em falta, errada ou cliente desativado
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Adormecido:
      description: Veículo a dormir ou offline
      content:
        application/json:
          schema:
            type: object
            properties:
              erro: { type: string }
              estado: { type: string, example: asleep }
    SemPermissao:
      description: O cliente não tem a permissão necessária, ou a funcionalidade está desativada no gateway (ver GET /api/me)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    FalhaTesla:
      description: Falha na Tesla ou na renovação do token
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    SemTokens:
      description: Gateway sem tokens (falta `tesla-setup token`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }

paths:
  /api/health:
    get:
      summary: Gateway a responder
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }

  /api/me:
    get:
      summary: Nome e permissões do cliente (sempre permitido)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente: { type: string }
                  permissoes:
                    type: array
                    items:
                      type: string
                      enum: [veiculos, carga, clima, conducao, estado, config, localizacao, imagem, token, acordar, fleet, viagens, consumo, carregamentos, bateria]
                  desativadas_no_gateway: { type: array, items: { type: string } }
                  descricao: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }

  /api/token/status:
    get:
      summary: Estado do token Tesla (valida também a chave do cliente)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/TokenStatus" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles:
    get:
      summary: Lista de veículos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: array, items: { $ref: "#/components/schemas/Veiculo" } }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "502": { $ref: "#/components/responses/FalhaTesla" }
        "503": { $ref: "#/components/responses/SemTokens" }

  /api/vehicles/{vin}:
    get:
      summary: Estado do veículo (não acorda o carro)
      parameters: [{ $ref: "#/components/parameters/vin" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { response: { $ref: "#/components/schemas/Veiculo" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/data:
    get:
      summary: Dados do veículo (vehicle_data) com cache
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: endpoints
          in: query
          schema:
            type: string
            default: charge_state;climate_state;drive_state;vehicle_state;vehicle_config
          description: Secções separadas por `;` (também location_data, gui_settings)
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
          description: "1 ignora a cache"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleData" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "408": { $ref: "#/components/responses/Adormecido" }
        "429": { description: Limite de pedidos da Tesla }
        "502": { $ref: "#/components/responses/FalhaTesla" }
        "503": { $ref: "#/components/responses/SemTokens" }

  /api/vehicles/{vin}/location:
    get:
      summary: Localização simplificada (requer o scope vehicle_location)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  vin: { type: string }
                  latitude: { type: number }
                  longitude: { type: number }
                  direcao: { type: integer, nullable: true, description: graus }
                  velocidade_kmh: { type: integer, nullable: true }
                  mudanca: { type: string, nullable: true, description: "P, R, N, D" }
                  gps_em: { type: string, format: date-time, nullable: true }
                  mapa: { type: string, description: URL OpenStreetMap }
                  cache: { type: boolean }
                  idade_s: { type: integer }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403":
          description: Sem a permissão localizacao, ou sem coordenadas (falta o scope vehicle_location)
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "408": { $ref: "#/components/responses/Adormecido" }

  /api/vehicles/{vin}/image:
    get:
      summary: Imagem do modelo (render do configurador Tesla, não das câmaras)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - name: view
          in: query
          schema: { type: string, default: STUD_3QTR, enum: [STUD_3QTR, STUD_SIDE, STUD_REAR, STUD_FRONT, STUD_SEAT] }
        - name: size
          in: query
          schema: { type: integer, default: 800, minimum: 200, maximum: 2048 }
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
        - name: formato
          in: query
          schema: { type: string, enum: [url] }
          description: "url devolve só o URL do compositor em JSON"
      responses:
        "200":
          description: Imagem (ou JSON com formato=url)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  origem: { type: string, enum: [config, auto] }
                  view: { type: string }
                  size: { type: integer }
        "400":
          description: view inválida
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "408": { $ref: "#/components/responses/Adormecido" }
        "502": { $ref: "#/components/responses/FalhaTesla" }

  /api/vehicles/{vin}/trips:
    get:
      summary: Viagens registadas pelo gateway (mais recentes primeiro)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { $ref: "#/components/parameters/ano" }
        - { $ref: "#/components/parameters/mes" }
        - { $ref: "#/components/parameters/semana" }
        - { $ref: "#/components/parameters/dias" }
        - { $ref: "#/components/parameters/de" }
        - { $ref: "#/components/parameters/ate" }
        - { name: limite, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  viagens: { type: array, items: { $ref: "#/components/schemas/Viagem" } }
                  resumo:
                    type: object
                    properties: { n: { type: integer }, km: { type: number }, bateria: { type: integer }, vmax: { type: integer, nullable: true } }
                  de: { type: string }
                  ate: { type: string }
        "400": { description: Período inválido }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/trips/{id}:
    get:
      summary: Viagem com o percurso
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Viagem" }
                  - type: object
                    properties:
                      percurso:
                        type: array
                        items:
                          type: object
                          properties: { ts: { type: string }, lat: { type: number }, lon: { type: number }, velocidade_kmh: { type: integer, nullable: true }, direcao: { type: integer, nullable: true }, bateria: { type: integer, nullable: true }, odo_km: { type: number, nullable: true } }
        "404": { description: Viagem não encontrada }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/charges:
    get:
      summary: Carregamentos registados pelo gateway (permissão carregamentos)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { $ref: "#/components/parameters/ano" }
        - { $ref: "#/components/parameters/mes" }
        - { $ref: "#/components/parameters/semana" }
        - { $ref: "#/components/parameters/dias" }
        - { $ref: "#/components/parameters/de" }
        - { $ref: "#/components/parameters/ate" }
        - { name: origem, in: query, schema: { type: string, enum: [leituras, inferido, supercharger, tessie] } }
        - { name: limite, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  carregamentos: { type: array, items: { $ref: "#/components/schemas/Carregamento" } }
                  resumo: { type: object, properties: { n: { type: integer }, kwh: { type: number }, custo: { type: number }, moeda: { type: string, nullable: true }, dc: { type: integer }, sc: { type: integer }, bateria: { type: integer } } }
        "400": { description: Filtro inválido }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/charges/{id}:
    get:
      summary: Carregamento com a curva
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Carregamento" }
                  - type: object
                    properties:
                      curva: { type: array, items: { type: object, properties: { ts: { type: string }, bateria: { type: integer, nullable: true }, potencia_kw: { type: number, nullable: true }, energia_kwh: { type: number, nullable: true } } } }
        "404": { description: Não encontrado }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/battery-health:
    get:
      summary: Saúde da bateria ao longo do tempo (permissão bateria)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { $ref: "#/components/parameters/ano" }
        - { $ref: "#/components/parameters/mes" }
        - { $ref: "#/components/parameters/semana" }
        - { $ref: "#/components/parameters/dias" }
        - { $ref: "#/components/parameters/de" }
        - { $ref: "#/components/parameters/ate" }
        - { name: origem, in: query, schema: { type: string, enum: [leituras, tessie] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  medicoes: { type: array, items: { type: object, properties: { ts: { type: string }, odo_km: { type: number, nullable: true }, autonomia_max_km: { type: number, nullable: true }, autonomia_ideal_km: { type: number, nullable: true }, capacidade_kwh: { type: number, nullable: true }, origem: { type: string } } } }
                  resumo: { type: object }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/idles:
    get:
      summary: Paragens e energia perdida com o carro parado (permissão bateria)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { $ref: "#/components/parameters/ano" }
        - { $ref: "#/components/parameters/mes" }
        - { $ref: "#/components/parameters/semana" }
        - { $ref: "#/components/parameters/dias" }
        - { $ref: "#/components/parameters/de" }
        - { $ref: "#/components/parameters/ate" }
        - { name: limite, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  paragens: { type: array, items: { type: object } }
                  resumo: { type: object, properties: { n: { type: integer }, kwh: { type: number }, bateria: { type: integer } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/vehicles/{vin}/positions:
    get:
      summary: Posições registadas (agregado=1 para mapa de calor)
      parameters:
        - { $ref: "#/components/parameters/vin" }
        - { $ref: "#/components/parameters/ano" }
        - { $ref: "#/components/parameters/mes" }
        - { $ref: "#/components/parameters/semana" }
        - { $ref: "#/components/parameters/dias" }
        - { $ref: "#/components/parameters/de" }
        - { $ref: "#/components/parameters/ate" }
        - { name: agregado, in: query, schema: { type: string, enum: ["0", "1"], default: "1" } }
        - { name: so_viagens, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pontos: { type: array, items: { type: object, properties: { lat: { type: number }, lon: { type: number }, n: { type: integer } } } }
                  agregado: { type: boolean }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/recolha:
    get:
      summary: Estado da recolha de viagens (permissão viagens)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ativa: { type: boolean }
                  intervalos: { type: object, additionalProperties: { type: integer } }
                  veiculos:
                    type: array
                    items:
                      type: object
                      properties: { vin: { type: string }, estado: { type: string }, ultima_leitura: { type: string, nullable: true }, proxima_leitura: { type: string, nullable: true }, bateria: { type: integer, nullable: true }, leituras_hoje: { type: integer }, limite_diario: { type: integer } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/consumo:
    get:
      summary: Consumo estimado de créditos no mês, todos os clientes (permissão consumo)
      parameters:
        - { name: mes, in: query, schema: { type: string }, description: "AAAA-MM (omissão: mês atual)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mes: { type: string }
                  total_usd: { type: number }
                  credito_usd: { type: number }
                  credito_usado_pct: { type: number, nullable: true }
                  categorias: { type: object, additionalProperties: { type: object, properties: { pedidos: { type: integer }, preco: { type: number }, custo: { type: number }, hoje: { type: integer }, limite_dia: { type: integer } } } }
                  por_cliente: { type: array, items: { type: object, properties: { cliente: { type: string }, categoria: { type: string }, n: { type: integer }, custo: { type: number } } } }
                  por_caminho: { type: array, items: { type: object } }
                  por_dia: { type: array, items: { type: object, properties: { dia: { type: string }, n: { type: integer } } } }
        "400": { description: mes inválido }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/me/consumo:
    get:
      summary: Consumo estimado só deste cliente (sempre permitido)
      parameters:
        - { name: mes, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente: { type: string }
                  mes: { type: string }
                  total_usd: { type: number }
                  categorias: { type: object, additionalProperties: { type: object, properties: { pedidos: { type: integer }, custo: { type: number } } } }
        "401": { $ref: "#/components/responses/NaoAutorizado" }

  /api/endpoints:
    get:
      summary: Referência dos endpoints (sem autenticação)
      security: []
      responses:
        "200": { description: Lista de endpoints }

  /api/vehicles/{vin}/wake:
    post:
      summary: Acorda o carro (custo extra, gasta bateria)
      parameters: [{ $ref: "#/components/parameters/vin" }]
      responses:
        "200": { description: "Pedido aceite; consultar /api/vehicles/{vin} até state=online" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /api/fleet/{caminho}:
    get:
      summary: Passthrough só de leitura para /api/1/{caminho} da Fleet API
      parameters:
        - name: caminho
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Resposta da Tesla sem alterações }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
