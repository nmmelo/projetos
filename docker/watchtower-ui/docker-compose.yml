# Variáveis em .env (copiar de .env.example) ou, numa stack do Portainer, em "Environment variables"
services:
  watchtower-ui:
    build:
      context: .
      args:
        SSH_USER: ${SSH_USER:-admin}
        SSH_UID: ${SSH_UID:-1001}
    image: watchtower-ui:latest
    pull_policy: build            # reconstrói sempre a imagem no deploy
    container_name: ${CONTAINER_NAME:-watchtower-ui}
    hostname: watchtower-ui
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # imagem local: o Watchtower não a atualiza
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      # Portal
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PROXY_HOPS: ${PROXY_HOPS:-1}
      DEFAULT_THEME: ${DEFAULT_THEME:-escuro}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      # Watchtower
      WATCHTOWER_HOST: ${WATCHTOWER_HOST:-watchtower}
      WATCHTOWER_PORT: ${WATCHTOWER_PORT:-8080}
      WATCHTOWER_CONTAINER: ${WATCHTOWER_CONTAINER:-watchtower}
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?definir no .env}
      # SSH
      SSH_PUBKEY: ${SSH_PUBKEY:-}
      SSH_EXTRA_USER: ${SSH_EXTRA_USER:-}
      SSH_EXTRA_PUBKEY: ${SSH_EXTRA_PUBKEY:-}
      SSH_EXTRA_SUDO: ${SSH_EXTRA_SUDO:-1}
      SSH_EXTRA_UID: ${SSH_EXTRA_UID:-}
    ports:
      - "${UI_PORT:-8090}:80"     # portal (só rede local)
      - "${SSH_PORT:-2224}:22"    # SSH (só rede local, não abrir no router)
    volumes:
      # DATA_DIR: pasta dos dados no anfitrião ("." = pasta do projeto;
      # numa stack do Portainer a partir do Git tem de ser um caminho absoluto)
      - ${DATA_DIR:-.}/db:/data/db                 # base de dados SQLite
      - ${DATA_DIR:-.}/logs:/data/logs             # logs do portal e do nginx
      - ${DATA_DIR:-.}/ssh/authorized_keys:/import/authorized_keys:ro
      - ${DATA_DIR:-.}/hostkeys:/etc/ssh/keys
      # Opcional: socket do Docker (estado a correr/parado, label de versão, logs do watchtower em tempo real).
      # Sem ele, tudo vem dos relatórios do Watchtower (webhook).
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - watchtower-net
      # - web-net            # opcional: saída web do portal noutra rede (ex. a do proxy reverso)

networks:
  # Rede já existente, partilhada com o contentor watchtower
  watchtower-net:
    name: ${WATCHTOWER_NETWORK:-watchtower-net}
    external: true
  # web-net:
  #   name: ${WEB_NETWORK:-proxy-net}
  #   external: true
