{% extends "base.html" %}
{% block content %}
<h1>Mudar password</h1>
<div class="card" style="max-width:420px">
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="atual" type="password" placeholder="Password atual" required style="width:100%"></p>
    <p><input name="nova" type="password" placeholder="Nova password (mín. 8)" minlength="8" required autocomplete="new-password" style="width:100%"></p>
    <p><input name="confirmar" type="password" placeholder="Confirmar nova password" minlength="8" required autocomplete="new-password" style="width:100%"></p>
    <button>Guardar</button>
  </form>
</div>
{% endblock %}
