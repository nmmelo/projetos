# Exemplo: o que acrescentar ao compose do watchtower que já existe.
# Os valores <...> vêm do .env do watchtower-ui (mesmos tokens).
services:
  watchtower:
    # ... manter image, volumes, schedule, cleanup, etc. que já existem
    environment:
      # HTTP API (botões de atualizar e métricas do portal)
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_METRICS: "true"
      WATCHTOWER_HTTP_API_TOKEN: "<WATCHTOWER_HTTP_API_TOKEN>"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"   # sem isto deixa de verificar sozinho

      # Relatório de cada verificação enviado ao portal: todos os contentores verificados (estado, imagem atual
      # e nova, erro) + linhas de log da sessão. É daqui que o portal tira a lista e o histórico (sem socket).
      WATCHTOWER_NOTIFICATION_URL: "generic+http://watchtower-ui/api/webhook/<WEBHOOK_TOKEN>"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
      WATCHTOWER_NOTIFICATION_TEMPLATE: |-
        {{- if .Report -}}{"scanned":{{len .Report.Scanned}},"containers":[{}{{range .Report.All}},{"name":{{printf "%q" .Name}},"image":{{printf "%q" .ImageName}},"state":{{printf "%q" .State}},"from":{{printf "%q" .CurrentImageID}},"to":{{printf "%q" .LatestImageID}},"error":{{printf "%q" .Error}}}{{end}}],"entries":[{}{{range .Entries}},{"time":"{{.Time.Format "2006-01-02 15:04:05"}}","level":"{{.Level}}","msg":{{printf "%q" .Message}}}{{end}}]}{{- end -}}
    networks:
      - watchtower-net
    # Não é preciso publicar a porta 8080

networks:
  watchtower-net:
    name: watchtower-net
    external: true
