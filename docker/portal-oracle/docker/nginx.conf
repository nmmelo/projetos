server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;          # upload de backups

    location /static/ {
        alias /srv/portal/app/static/;
        expires 1h;
    }

    # Gunicorn parado ou a reiniciar: pagina estatica em vez de "502 Bad Gateway"
    error_page 502 504 /indisponivel.html;
    location = /indisponivel.html {
        root /srv/portal/app/static;
        internal;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
