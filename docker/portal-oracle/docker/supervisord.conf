; Processos do contentor. Logs: docker-compose logs -f   |   estado: supervisorctl status
[program:gunicorn]
command=/opt/venv/bin/gunicorn -c /srv/portal/gunicorn.conf.py wsgi:app
directory=/srv/portal
user=portal
environment=HOME="/home/portal",USER="portal",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
