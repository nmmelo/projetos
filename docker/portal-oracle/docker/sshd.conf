# SSH para os membros do grupo 'sshusers': 'portal' e os utilizadores de data/ssh/users/.
# A autenticacao por password e ligada/desligada pelo entrypoint (00-auth.conf).
HostKey /srv/portal/data/ssh/ssh_host_ed25519_key
HostKey /srv/portal/data/ssh/ssh_host_rsa_key
PermitRootLogin no
AllowGroups sshusers
PubkeyAuthentication yes
# Chaves geridas pelo entrypoint, fora do mount (NAS/ACL nao bloqueiam a leitura).
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding yes        # necessario para o VS Code Remote-SSH
ClientAliveInterval 60
LogLevel VERBOSE              # mostra no 'docker-compose logs' o motivo de cada recusa
