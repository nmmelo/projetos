{% extends "base.html" %}
{% block title %}Sistema · Painel{% endblock %}
{% block content %}
{% include "sistema/_tabs.html" %}
<div class="sys-bar">
  <span class="sys-live" id="live"><span class="dot"></span> <span id="livetxt">a ligar…</span></span>
  <span class="muted small" id="origem"></span>
  <span class="buttons">
    <button type="button" class="small" id="pausa" title="Parar/retomar a atualização automática">⏸ Pausa</button>
    <button type="button" class="small" id="repor" title="Ordem e cartões minimizados por omissão">Repor disposição</button>
  </span>
</div>
<p class="muted small">Arraste os cartões pelo cabeçalho para os reorganizar; <b>–</b> minimiza. A disposição fica guardada neste browser.</p>
<div class="sys-grid" id="grid"></div>
<div class="sys-toast" id="toast" hidden></div>
{% endblock %}
{% block scripts %}
<script>
const API = "{{ url_for('sistema.api_estado') }}", ACAO = "{{ url_for('sistema.acao') }}", CSRF = "{{ csrf_token }}";
const PODE = {{ 'true' if pode_servicos else 'false' }};
const K_ORDEM = 'sistema.ordem', K_MIN = 'sistema.min';
const grid = document.getElementById('grid');
let pausa = false, ultimo = null, pedidos = {}, acoesVistas = null;
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const gb = b => b == null ? '—' : (b / 1073741824).toFixed(2) + ' GB';
const mb = b => b == null ? '—' : b >= 1073741824 ? gb(b) : (b / 1048576).toFixed(0) + ' MB';
const tempo = s => { if (s == null) return '—'; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m` : `${m}m ${Math.floor(s % 60)}s`; };
const ICONE = {recursos: '📊', sistema: '🖥️', discos: '💾', agente: '🛰️', acoes: '📜', nginx: '🌐', portal: '🐍', '': '⚙️'};
const ESTADO = {active: ['Em execução', 'ok'], inactive: ['Parado', 'off'], failed: ['Falhou', 'bad'], activating: ['A iniciar', 'warn'],
                deactivating: ['A parar', 'warn'], reloading: ['A recarregar', 'warn'], desconhecido: ['Desconhecido', 'off']};

// ---------------------------------------------------------------- cartoes (criar, ordenar, minimizar, arrastar)
function cartao(id, titulo, largo) {
  let c = document.getElementById('c-' + id);
  if (c) return c;
  c = document.createElement('section');
  c.className = 'sys-card' + (largo ? ' largo' : ''); c.id = 'c-' + id; c.dataset.id = id;
  c.innerHTML = `<header class="sys-head" draggable="true" title="Arraste para mudar a ordem">
      <span class="sys-grip">⋮⋮</span><span class="sys-t">${esc(titulo)}</span>
      <button type="button" class="sys-min" title="Minimizar / expandir">–</button></header>
    <div class="sys-body"></div>`;
  c.querySelector('.sys-min').onclick = () => { c.classList.toggle('min'); guardarMin(); };
  if (ls.get(K_MIN, []).includes(id)) c.classList.add('min');
  const h = c.querySelector('.sys-head');
  h.addEventListener('dragstart', e => { c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); });
  h.addEventListener('dragend', () => { c.classList.remove('drag'); guardarOrdem(); });
  grid.appendChild(c);
  ordenar();
  return c;
}
grid.addEventListener('dragover', e => {
  e.preventDefault();
  const arr = grid.querySelector('.drag'); if (!arr) return;
  const alvo = e.target.closest('.sys-card');
  if (!alvo || alvo === arr) return;
  const r = alvo.getBoundingClientRect();
  const depois = (e.clientY - r.top) / r.height > .5 || (e.clientX - r.left) / r.width > .5;
  grid.insertBefore(arr, depois ? alvo.nextSibling : alvo);
});
function guardarOrdem() { ls.set(K_ORDEM, [...grid.children].map(c => c.dataset.id)); }
function guardarMin() { ls.set(K_MIN, [...grid.querySelectorAll('.sys-card.min')].map(c => c.dataset.id)); }
function ordenar() {
  const ordem = ls.get(K_ORDEM, []);
  const pos = id => { const i = ordem.indexOf(id); return i < 0 ? 1000 + defeito(id) : i; };
  [...grid.children].sort((a, b) => pos(a.dataset.id) - pos(b.dataset.id)).forEach(c => grid.appendChild(c));
}
function defeito(id) { return ['recursos', 'sistema', 'agente'].indexOf(id) >= 0 ? ['recursos', 'sistema', 'agente'].indexOf(id)
  : id.startsWith('svc:') ? 10 : id === 'discos' ? 50 : 60; }
document.getElementById('repor').onclick = () => { ls.set(K_ORDEM, []); ls.set(K_MIN, []);
  grid.querySelectorAll('.sys-card').forEach(c => c.classList.remove('min')); ordenar(); };
document.getElementById('pausa').onclick = e => { pausa = !pausa; e.target.textContent = pausa ? '▶ Retomar' : '⏸ Pausa'; if (!pausa) atualizar(); };

// ---------------------------------------------------------------- conteudo
const pill = (txt, cls) => `<span class="sys-pill ${cls}">${esc(txt)}</span>`;
const kv = linhas => `<dl class="sys-kv">${linhas.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
const topo = (icone, nome, sub, estado) => `<div class="sys-top"><span class="sys-ico">${icone}</span>
  <div class="sys-name"><strong>${esc(nome)}</strong><small>${esc(sub || '')}</small></div>${estado || ''}</div>`;
function barra(rotulo, pct, cor, esq, dir) {
  return `<div class="sys-res"><div class="sys-res-h"><b>${esc(rotulo)}</b><span class="c-${cor}">${pct == null ? '—' : pct.toFixed(1) + '%'}</span></div>
    <div class="sys-meter"><span class="m-${cor}" style="width:${pct || 0}%"></span></div>
    <div class="sys-res-f"><span>${esq}</span><span>${dir}</span></div></div>`;
}
function spark(hist, idx, cor) {
  const pts = hist.filter(p => p[idx] != null);
  if (pts.length < 2) return '';
  const w = 300, h = 40, t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const xy = pts.map(p => `${((p[0] - t0) / Math.max(t1 - t0, 1) * w).toFixed(1)},${(h - p[idx] / 100 * h).toFixed(1)}`).join(' ');
  return `<svg class="sys-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline class="s-${cor}" points="${xy}"/></svg>`;
}

function desenhar(d) {
  const m = d.metricas, ag = d.agente, hist = m.historico || [];
  const raiz = (m.discos || []).find(x => x.ponto === '/') || (m.discos || [])[0] || {};
  // Recursos
  cartao('recursos', 'Recursos de hardware (CPU, RAM e disco)', true).querySelector('.sys-body').innerHTML =
    topo(ICONE.recursos, 'Recursos de hardware', `${m.cpu_modelo || ''} (${m.cpus || '?'} CPUs)`,
         pill(m.cpu > 90 || m.mem.pct > 92 || raiz.pct > 92 ? 'Sob pressão' : 'Operacional', m.cpu > 90 || m.mem.pct > 92 || raiz.pct > 92 ? 'warn' : 'ok')) +
    `<div class="sys-res3">` +
    barra('CPU (carga e utilização)', m.cpu, 'cpu', `Livre: <b>${m.cpu == null ? '—' : (100 - m.cpu).toFixed(1) + '%'}</b>`,
          `Load (1/5/15m): <b>${(m.load || []).join(' / ')}</b>`) + spark(hist, 1, 'cpu').replace('<svg', '<svg data-k="cpu"') +
    barra('Memória RAM', m.mem.pct, 'ram', `Livre: <b>${gb(m.mem.livre)}</b>`, `Total: <b>${gb(m.mem.total)}</b> (usado ${gb(m.mem.usado)})`) +
    spark(hist, 2, 'ram') +
    barra(`Disco ${raiz.ponto || ''}`, raiz.pct, 'disk', `Livre: <b>${gb(raiz.livre)}</b>`, `Total: <b>${gb(raiz.total)}</b> (usado ${gb(raiz.usado)})`) +
    `</div>`;
  // Sistema
  cartao('sistema', 'Servidor').querySelector('.sys-body').innerHTML =
    topo(ICONE.sistema, m.host || 'servidor', m.os || '', pill('Ligado ' + tempo(m.uptime), 'ok')) +
    kv([['Sistema', `<code>${esc(m.os)}</code>`], ['Kernel', `<code>${esc(m.kernel)}</code>`],
        ['Ligado há', `<code>${tempo(m.uptime)}</code>`], ['Processos', `<code>${m.processos ?? '—'}</code>`],
        ['Swap', `<code>${m.mem.swap_total ? mb(m.mem.swap_usado) + ' de ' + mb(m.mem.swap_total) + ' (' + m.mem.swap_pct + '%)' : 'sem swap'}</code>`],
        ['Python', `<code>${esc(m.python)}</code>`]]);
  // Agente
  const aEst = ag.ativo ? pill('Ativo', 'ok') : pill('Parado', 'bad');
  cartao('agente', 'Agente do portal').querySelector('.sys-body').innerHTML =
    topo(ICONE.agente, 'Agente do portal', 'Execuções Oracle, métricas e serviços', aEst) +
    (ag.ativo ? kv([['Versão / PID', `<code>${esc(ag.versao)} · pid ${esc(ag.pid)}</code>`],
        ['Em execução desde', `<code>${new Date(ag.inicio * 1000).toLocaleString('pt-PT')}</code>`],
        ['Último sinal', `<code>há ${ag.ha}s</code>`], ['Utilizador', `<code>${esc(ag.user)}</code>`],
        ['Execuções Oracle', `<code>${(ag.execucoes || []).length ? (ag.execucoes || []).map(i => '#' + i).join(', ') : 'nenhuma em curso'}</code>`],
        ['Serviços', `<code>${esc({systemd: 'systemd', supervisor: 'supervisord'}[m.backend] || 'sem gestor')}</code>`]])
     : `<p class="sys-aviso">Sem o agente: as execuções correm dentro do portal (param se o portal reiniciar), estes dados são lidos
        pelo portal a cada pedido e não é possível iniciar/parar serviços. Inicie o serviço do agente
        (<code>systemctl start &lt;nome&gt;-agente</code>).</p>`);
  // Servicos
  const vivos = new Set();
  (m.servicos || []).forEach(s => {
    const id = 'svc:' + s.unit; vivos.add(id);
    const [et, ec] = ESTADO[s.estado] || [s.estado, 'off'];
    const pedido = pedidos[s.unit];
    const c = cartao(id, s.unit);
    const prot = s.papel === 'portal' || s.papel === 'nginx';
    const botoes = !PODE ? '' : `<div class="sys-act">
        ${s.estado !== 'active' ? `<button type="button" class="small primary" data-a="start">▶ Start</button>` : ''}
        ${s.estado === 'active' ? `<button type="button" class="small" data-a="restart">⟳ Restart</button>` : ''}
        ${s.estado === 'active' ? `<button type="button" class="small danger" data-a="stop">■ Stop</button>` : ''}
        ${pedido ? `<span class="sys-pedido">⏳ ${esc(pedido)}…</span>` : ''}</div>`;
    c.querySelector('.sys-body').innerHTML =
      topo(ICONE[s.papel || ''], s.unit, s.descricao || '', pill(s.existe === false ? 'Não existe' : et, s.existe === false ? 'off' : ec)) +
      kv([['Estado', `<code>${esc(s.estado)}${s.sub ? ' (' + esc(s.sub) + ')' : ''}</code>`],
          s.pid ? ['PID', `<code>${s.pid}</code>`] : null,
          s.memoria != null ? ['Memória', `<code>${mb(s.memoria)}</code>`] : null,
          s.cpu_pct != null ? ['CPU', `<code>${s.cpu_pct}%</code>`] : null,
          s.tarefas != null ? ['Tarefas', `<code>${s.tarefas}</code>`] : null,
          s.desde ? ['Desde', `<code>${esc(s.desde)}</code>`] : null,
          s.arranque ? ['Arranque', `<code>${esc(s.arranque)}</code>`] : null,
          s.reinicios ? ['Reinícios automáticos', `<code>${s.reinicios}</code>`] : null]) + botoes;
    c.querySelectorAll('[data-a]').forEach(b => b.onclick = () => pedir(s, b.dataset.a));
    c.dataset.prot = prot ? '1' : '';
  });
  grid.querySelectorAll('.sys-card[id^="c-svc:"]').forEach(c => { if (!vivos.has(c.dataset.id)) c.remove(); });
  // Discos
  cartao('discos', 'Sistemas de ficheiros').querySelector('.sys-body').innerHTML =
    topo(ICONE.discos, 'Sistemas de ficheiros', `${(m.discos || []).length} montado(s)`, '') +
    (m.discos || []).map(x => barra(x.ponto, x.pct, x.pct > 90 ? 'bad' : 'disk', `Livre: <b>${gb(x.livre)}</b>`,
                                    `${esc(x.fs || '')} ${gb(x.total)}`)).join('');
  // Ultimas acoes
  cartao('acoes', 'Últimas ações sobre serviços').querySelector('.sys-body').innerHTML =
    topo(ICONE.acoes, 'Últimas ações', 'start / stop / restart pedidos no portal', '') +
    (d.acoes.length ? `<table class="sys-tab"><tbody>${d.acoes.map(a => `<tr><td><code>${esc(a.requested_at.slice(5, 16))}</code></td>
        <td>${esc(a.action)} <b>${esc(a.unit)}</b></td><td>${esc(a.requested_by)}</td>
        <td>${pill(a.status, a.status === 'OK' ? 'ok' : a.status === 'ERRO' ? 'bad' : 'warn')}</td>
        <td class="small" title="${esc(a.result)}">${esc((a.result || '').slice(0, 60))}</td></tr>`).join('')}</tbody></table>`
      : '<p class="muted">Ainda não houve ações.</p>');
  // avisos de resultado das acoes pedidas nesta pagina
  d.acoes.forEach(a => { if (pedidos['#' + a.id] && a.status !== 'PENDENTE') {
    toast(`${a.action} ${a.unit}: ${a.status === 'OK' ? 'concluído' : 'falhou — ' + a.result}`, a.status === 'OK');
    delete pedidos[pedidos['#' + a.id]]; delete pedidos['#' + a.id]; } });
}

async function pedir(s, acao) {
  const avisos = {portal: 'Este é o próprio portal: a página fica indisponível durante uns segundos' + (acao === 'stop' ? ' e o portal deixa de responder até alguém o iniciar no servidor.' : '.'),
                  nginx: 'O Nginx serve o portal' + (acao === 'stop' ? ': ao parar, perde o acesso ao portal até o iniciar no servidor.' : ': a página fica indisponível durante uns segundos.'),
                  agente: 'O agente faz as execuções Oracle e estas métricas: as execuções em curso ficam INTERROMPIDO.'};
  const extra = avisos[s.papel] ? '\n\n' + avisos[s.papel] : '';
  if (!confirm(`${acao.toUpperCase()} do serviço ${s.unit}?${extra}`)) return;
  const r = await fetch(ACAO, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF': CSRF},
                               body: JSON.stringify({unit: s.unit, acao})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { toast(j.error || 'Não foi possível pedir a ação.', false); return; }
  pedidos[s.unit] = acao; pedidos['#' + j.id] = s.unit;
  atualizar();
}
let toastT;
function toast(msg, ok) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'sys-toast ' + (ok ? 'ok' : 'bad');
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 6000); }

async function atualizar() {
  try {
    const r = await fetch(API, {cache: 'no-store'});
    if (r.status === 503) { live(false, 'portal em manutenção'); return; }
    const d = await r.json();
    desenhar(d); ultimo = Date.now();
    live(true, d.metricas.origem === 'agente' ? 'em direto (agente)' : 'leitura direta (agente parado)');
    document.getElementById('origem').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-PT');
  } catch (e) { live(false, 'sem ligação ao portal'); }
}
function live(ok, txt) { const l = document.getElementById('live'); l.classList.toggle('off', !ok); document.getElementById('livetxt').textContent = txt; }
atualizar();
setInterval(() => { if (!pausa && !document.hidden) atualizar(); }, 2000);
</script>
{% endblock %}
