{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ portal_name }}</h1>
  {% if no_admin %}
  <div class="flash error">
    O administrador ainda não foi configurado. No contentor, corra
    <code>python manage.py set-admin-password</code>.
  </div>
  {% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Utilizador <input name="user" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Entrar</button>
  </form>
</section>
{% endblock %}
